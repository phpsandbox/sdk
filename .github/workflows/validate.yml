name: SDK validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check manual release safeguards
        run: node --test scripts/releases/release.test.mjs
      - name: Check release tooling formatting
        run: ./node_modules/.bin/oxfmt --check scripts/releases
      - name: Check lint, formatting, types, tests, build, and package
        run: npm run check
