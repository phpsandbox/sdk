name: Release to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm publication channel
        type: choice
        default: latest
        options: [latest, canary]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@11

      - name: Validate publication channel
        env:
          RELEASE_NPM_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { publicationTag } from "./scripts/releases/release.mjs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            publicationTag(version, process.env.RELEASE_NPM_TAG);
          '

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: npm run check

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to npm
        env:
          RELEASE_NPM_TAG: ${{ inputs.tag }}
        run: npm publish --access public --tag "$RELEASE_NPM_TAG"

      - name: Tag the published version
        run: |
          version=$(node -p "require('./package.json').version")
          git tag "v${version}"
          git push origin "v${version}"
