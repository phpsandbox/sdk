name: Production smoke tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ matrix.transport }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transport:
          - realtime
          - http
    steps:
      - name: Check out SDK
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.transport }} smoke
        env:
          PHPSANDBOX_API_URL: https://api.phpsandbox.io/v1
          PHPSANDBOX_SMOKE_TOKEN: ${{ secrets.PHPSANDBOX_SMOKE_TOKEN }}
          PHPSANDBOX_SMOKE_TRANSPORT: ${{ matrix.transport }}
        run: npm run smoke:pr
